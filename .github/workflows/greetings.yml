name: Greetings

on: [pull_request, issues]

permissions:
  contents: read

jobs:
  greeting:
    permissions:
      issues: write  # for actions/first-interaction to comment on first issue
      pull-requests: write  # for actions/first-interaction to comment on first PR
    runs-on: cx-public-ubuntu-x64
    steps:
    - uses: actions/first-interaction@3c71ce730280171fd1cfb57c00c774f8998586f7 # v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Thanks for raising the issue. Maintainer(s) will look into this shortly.'
        pr-message: 'Thanks for the PR. Cheers.'
